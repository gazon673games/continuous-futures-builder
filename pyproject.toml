[project]
name = "continuous-futures-builder"
version = "0.1.0"
description = "Local derived-data builder for continuous futures research datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
]

[project.scripts]
continuous-futures = "continuous_futures_builder.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/continuous_futures_builder"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
